<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>IGNITE OS</title>
	<script>
		// Detect base path and set up path resolution
		const currentScript = document.currentScript || document.scripts[document.scripts.length - 1];
		const baseURL = new URL(currentScript.src).pathname.substring(0, new URL(currentScript.src).pathname.lastIndexOf('/') + 1);
		
		// Override fetch to handle relative paths
		const originalFetch = window.fetch;
		window.fetch = function(resource, init) {
			if (typeof resource === 'string' && !resource.startsWith('http') && !resource.startsWith('//') && !resource.startsWith('data:')) {
				resource = baseURL + resource;
			}
			return originalFetch.call(this, resource, init);
		};
	</script>
	<link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' font-family='Arial'>⚡</text></svg>" type="image/x-icon" />
</head>
<body>
	<iframe id="contentframe" style="width: 100%; height: 100vh; border: none; opacity: 0;" frameborder="0"></iframe>
	<script>
		// Get base path from current script location
		const scriptURL = new URL(document.currentScript.src);
		const pathname = scriptURL.pathname;
		const baseDir = pathname.substring(0, pathname.lastIndexOf('/') + 1);
		
		console.log('Base directory:', baseDir);
		
		// Load index.html via iframe with proper base
		const iframe = document.getElementById('contentframe');
		iframe.src = baseDir + 'index.html';
		
		// Show iframe when loaded
		iframe.onload = function() {
			this.style.opacity = '1';
		};
		
		// Handle iframe communication
		window.addEventListener('message', (event) => {
			console.log('Message from iframe:', event.data);
		});
	</script>
</body>
</html>
